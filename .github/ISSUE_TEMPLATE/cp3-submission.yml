name: "Submit CP3"
description: "Submit your public CP3 practice repository for automatic and teacher grading."
title: "[CP3] Issues & Projects Submission"
body:
  - type: markdown
    attributes:
      value: |
        The completed public CP3 repository is detected automatically from the GitHub account that opens this submission. Keep the copied repository Public so the mother grader can read the trusted CP3 automatic grader output.

  - type: markdown
    attributes:
      value: |
        **Repository URL and GitHub username are detected automatically from the account that opens this submission.**
        The detected repository URL will be written into this Issue automatically.

  - type: checkboxes
    id: integrity
    attributes:
      label: Integrity Check
      options:
        - label: I used the official KLIS-CS CP3 Copy Exercise.
          required: true
        - label: My CP3 branch, Issue, and open Pull Request are visible in this repository.
          required: true
        - label: I did not include passwords, API keys, tokens, or other secrets.
          required: true
