name: Start Exercise

on:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  start:
    if: ${{ github.repository != 'KLIS-CS/GitHub-Issues-Projects-Workflow' }}
    runs-on: ubuntu-latest
    steps:
      - name: Create checkpoint issue
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const marker = '<!-- klis-cp3-exercise -->';
            const username = context.actor;
            const branch = `cp3-${username}`;

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'all', per_page: 100
            });
            const existing = issues.find(i => !i.pull_request && i.body?.includes(marker));
            if (existing) {
              core.info(`Exercise issue already exists: #${existing.number}`);
              return;
            }

            const body = `${marker}
            ## Checkpoint 3 — Issues & Project Management

            Welcome @${username}.

            **Required branch:** \`${branch}\`

            ### Your task

            1. Create a student work Issue whose title begins with \`[CP3]\`.
            2. Give it a Goal, at least two acceptance-criteria checkboxes, a label, and assign it to yourself.
            3. Add that work Issue to a GitHub Project and record the Project URL/statuses in \`submission.md\`.
            4. Complete \`submission.md\` on \`${branch}\`, commit, and push the branch.
            5. Open a Pull Request from \`${branch}\` → \`main\` and leave it open for grading.

            GitHub detects the student work Issue and Pull Request automatically. You do **not** need to enter an Issue number manually.

            ### Automatic grading

            The grader updates the score table **below in this same Exercise Issue** whenever you push or update the Pull Request.
            `;

            await github.rest.issues.create({
              owner, repo,
              title: 'Exercise: Checkpoint 3 — Issues & Project Management',
              body
            });
