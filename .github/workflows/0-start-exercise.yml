name: Start Exercise

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  start:
    runs-on: ubuntu-latest
    steps:
      - name: Create checkpoint issue
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const marker = '<!-- klis-cp3-exercise -->';
            const username = context.actor;
            const branch = `cp3-${username}`;

            const issues = await github.paginate(github.rest.issues.listForRepo, {owner, repo, state:'all', per_page:100});
            const existing = issues.find(i => !i.pull_request && i.body?.includes(marker));
            if (existing) { core.info(`Exercise issue already exists: #${existing.number}`); return; }

            const body = `${marker}
            ## Checkpoint 3 — Issues & Project Management

            Welcome @${username}.

            **Required branch:** \`${branch}\`

            ### Your task
            1. Read the repository README.
            2. Create an Issue whose title begins \`[CP3]\`.
            3. Include a Goal and at least two acceptance-criteria checkboxes.
            4. Add a label and assign the Issue to yourself.
            5. Add it to a GitHub Project and move it through appropriate statuses.
            6. Complete \`submission.md\` on the required branch.
            7. Commit, push, and open a Pull Request to \`main\`.
            8. Leave the Pull Request open for teacher review.
            `;

            await github.rest.issues.create({owner, repo, title:'Exercise: Checkpoint 3 — Issues & Project Management', body});
